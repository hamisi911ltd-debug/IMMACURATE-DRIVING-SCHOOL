<!-- TOPBAR -->
<header class="topbar">
  <button class="topbar-btn hamburger" id="hamburger" onclick="toggleSidebar()" style="display:none;">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="topbar-title" id="topbarTitle">Dashboard</div>
  <div class="topbar-search">
    <svg width="14" height="14" fill="none" stroke="#A0ADBF" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="Search anything..." id="globalSearch" onkeyup="performSearch()" oninput="performSearch()">
  </div>
  
  <!-- User Profile Dropdown in Top Right -->
  <div class="topbar-user-menu">
    <div class="topbar-user-card" onclick="toggleTopbarUserMenu()" id="topbarUserCard">
      <div class="topbar-user-avatar">H</div>
      <div class="topbar-user-info">
        <div class="topbar-user-name">Hamisi</div>
        <div class="topbar-user-role">System Administrator</div>
      </div>
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="transition:transform 0.2s;" id="topbarUserArrow">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
    <div class="topbar-user-dropdown" id="topbarUserDropdown">
      <div class="topbar-user-dropdown-item" onclick="openProfile()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Profile
      </div>
      <div class="topbar-user-dropdown-item" onclick="quickSwitchToStudent()" style="border-top:1px solid var(--border);">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Switch to Student
      </div>
      <div class="topbar-user-dropdown-item logout" onclick="logout()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Logout
      </div>
    </div>
  </div>
</header>
