name = "immacurate-dsms"
main = "functions/_worker.js"
compatibility_date = "2024-01-01"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "immacurate-dsms-db"
database_id = "your-database-id-here"

# Environment Variables
[vars]
ENVIRONMENT = "production"
APP_NAME = "Immacurate DSMS"
APP_VERSION = "1.0.0"

# Build configuration
[build]
command = "npm run build"
cwd = "."
watch_dirs = ["src"]

# Pages configuration
pages_build_output_dir = "dist"

# Development
[dev]
port = 8787
local_protocol = "http"

# Production environment
[env.production]
name = "immacurate-dsms-production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "immacurate-dsms-db"
database_id = "your-production-database-id"

# Staging environment
[env.staging]
name = "immacurate-dsms-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "immacurate-dsms-db-staging"
database_id = "your-staging-database-id"
