# Cloudflare Workers Configuration for DSMS

name = "dsms-backend"
main = "functions/_worker.js"
compatibility_date = "2024-01-01"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "dsms-database"
database_id = "8a093983-a79f-4006-8294-2ce7141d64d0"

# Environment Variables
[vars]
ENVIRONMENT = "production"
APP_NAME = "Immacurate Driving School Management System"
APP_VERSION = "1.0.0"

# Build Configuration
[build]
command = ""
cwd = ""
watch_dirs = ["functions"]

# Routes
routes = [
  { pattern = "*/api/*", zone_name = "your-domain.com" }
]

# Development
[env.development]
vars = { ENVIRONMENT = "development" }

# Production
[env.production]
vars = { ENVIRONMENT = "production" }
