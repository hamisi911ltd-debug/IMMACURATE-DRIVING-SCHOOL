<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Payments - Immacurate Driving School</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!-- Include Sidebar -->
<div id="sidebar-container"></div>

<!-- Include Topbar -->
<div id="topbar-container"></div>

<!-- MAIN CONTENT -->
<main class="main">
  <!-- PAYMENTS -->
  <section class="section active" id="payments">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" onclick="filterPayments('all',this)" style="background:var(--navy);color:var(--white);border-color:var(--navy);">All</button>
        <button class="btn btn-outline btn-sm" onclick="filterPayments('completed',this)">Completed</button>
        <button class="btn btn-outline btn-sm" onclick="filterPayments('pending',this)">Pending</button>
        <button class="btn btn-outline btn-sm" onclick="filterPayments('overdue',this)">Overdue</button>
      </div>
      <button class="btn btn-accent" onclick="openModal('addPaymentModal')">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Record Payment
      </button>
    </div>
    
    <div class="row-grid">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Recent Payments</div>
          <span class="card-link">Export All →</span>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Amount</th>
              <th>Method</th>
              <th>Date</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td data-label="Student">
                <div class="avatar-group">
                  <div class="avatar" style="background:#DBEAFE;color:#1D4ED8;">AK</div>
                  <div>
                    <div style="font-weight:600;font-size:13px;">Amina Kamau</div>
                    <div style="font-size:11px;color:var(--text-muted);">Class B</div>
                  </div>
                </div>
              </td>
              <td data-label="Amount" style="font-weight:600;color:var(--success);">KES 14,300</td>
              <td data-label="Method">M-Pesa</td>
              <td data-label="Date">May 5, 2026</td>
              <td data-label="Status"><span class="badge success">Completed</span></td>
              <td data-label="Action">
                <button class="btn btn-outline btn-sm" onclick="downloadReceiptPDF()">Receipt</button>
              </td>
            </tr>
            <tr>
              <td data-label="Student">
                <div class="avatar-group">
                  <div class="avatar" style="background:#F0FDF4;color:#15803D;">BN</div>
                  <div>
                    <div style="font-weight:600;font-size:13px;">Brian Njoroge</div>
                    <div style="font-size:11px;color:var(--text-muted);">Class A</div>
                  </div>
                </div>
              </td>
              <td data-label="Amount" style="font-weight:600;color:var(--warning);">KES 4,600</td>
              <td data-label="Method">Bank Transfer</td>
              <td data-label="Date">May 3, 2026</td>
              <td data-label="Status"><span class="badge warning">Pending</span></td>
              <td data-label="Action">
                <button class="btn btn-outline btn-sm" onclick="followUpPayment()">Follow Up</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div class="card">
        <div class="card-header"><div class="card-title">Generate Receipt</div></div>
        <div id="receiptPreview" style="border:1px solid var(--border);border-radius:10px;padding:16px;background:var(--bg);text-align:center;">
          <img src="../assets/images/receipt.jpeg" alt="Receipt Preview" style="max-width:100%;height:auto;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="btn btn-primary" style="flex:1;justify-content:center;" onclick="downloadReceiptPDF()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download PDF
          </button>
          <button class="btn btn-accent" style="flex:1;justify-content:center;" onclick="sendReceiptWhatsApp()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            WhatsApp
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="../js/app.js"></script>
<script>
// Load sidebar and topbar
document.addEventListener('DOMContentLoaded', function() {
  loadComponent('sidebar-container', '../components/sidebar.html');
  loadComponent('topbar-container', '../components/topbar.html');
});

function loadComponent(containerId, componentPath) {
  fetch(componentPath)
    .then(response => response.text())
    .then(html => {
      document.getElementById(containerId).innerHTML = html;
    });
}
</script>

</body>
</html>
