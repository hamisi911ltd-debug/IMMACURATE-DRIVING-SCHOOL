<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>User Management - Immacurate Driving School</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!-- Include Sidebar -->
<div id="sidebar-container"></div>

<!-- Include Topbar -->
<div id="topbar-container"></div>

<!-- MAIN CONTENT -->
<main class="main">
  <!-- USER MANAGEMENT -->
  <section class="section active" id="user-management">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div>
        <h2 style="font-size:24px;font-weight:700;margin-bottom:4px;">User Management</h2>
        <div style="font-size:14px;color:var(--text-muted);">Manage system administrators and managers</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" onclick="loadSystemUsers()" title="Refresh user list">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64l1.27 1.27m4.16 4.16l1.27 1.27A9 9 0 0 0 20.49 9z"/>
          </svg>
          Refresh
        </button>
        <button class="btn btn-accent" onclick="openAddUserModal()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add User
        </button>
      </div>
    </div>

    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:24px;">
      <div class="stat-card blue">
        <div class="stat-icon blue">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="stat-label">System Admins</div>
        <div class="stat-value" id="adminCount">2</div>
        <div class="stat-trend up">Full Access</div>
      </div>
      <div class="stat-card green">
        <div class="stat-icon green">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
          </svg>
        </div>
        <div class="stat-label">Managers</div>
        <div class="stat-value" id="managerCount">3</div>
        <div class="stat-trend up">Student Registration</div>
      </div>
      <div class="stat-card amber">
        <div class="stat-icon amber">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <div class="stat-label">Active Users</div>
        <div class="stat-value" id="activeUserCount">5</div>
        <div class="stat-trend up">Online Now</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">System Users</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline btn-sm" onclick="filterUsers('all',this)" style="background:var(--navy);color:var(--white);border-color:var(--navy);">All</button>
          <button class="btn btn-outline btn-sm" onclick="filterUsers('admin',this)">Admins</button>
          <button class="btn btn-outline btn-sm" onclick="filterUsers('manager',this)">Managers</button>
        </div>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Role</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Last Login</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="systemUsersTable">
          <!-- Users will be loaded dynamically by loadSystemUsers() function -->
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="../js/app.js"></script>
<script>
// Load sidebar and topbar
document.addEventListener('DOMContentLoaded', function() {
  loadComponent('sidebar-container', '../components/sidebar.html');
  loadComponent('topbar-container', '../components/topbar.html');
  
  // Load system users after components are loaded
  setTimeout(() => {
    loadSystemUsers();
  }, 500);
});

function loadComponent(containerId, componentPath) {
  fetch(componentPath)
    .then(response => response.text())
    .then(html => {
      document.getElementById(containerId).innerHTML = html;
    });
}
</script>

</body>
</html>
